name: monevo-dev

services:
  postgres:
    container_name: monevo-dev-postgres
    environment:
      POSTGRES_DB: monevo_dev
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    container_name: monevo-dev-backend
    build:
      context: ../../backend
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080

  fx-service:
    container_name: monevo-dev-fx-service
    build:
      context: ../../fx-service
    ports:
      - "127.0.0.1:8000:8000"

  cloudflared:
    container_name: monevo-dev-cloudflared
    restart: unless-stopped
    profiles: [ "tunnel" ]
